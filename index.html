<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이글루 필름 | Igloo Film</title>
    <!-- 폰트 변경: 얇고 감성적인 영문 폰트 (Playfair Display / Montserrat) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0b1120;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ❄️ 눈 내리는 효과 (크기 키우고 잘 보이도록 수정) */
        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10; opacity: 0.95;
        }

        /* === 1. 랜딩 화면 === */
        .hero-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('igloo_3.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 100;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 17, 32, 0.1) 0%, rgba(11, 17, 32, 0.55) 100%);
            z-index: -1;
        }

        .hero-screen.suck-in {
            transform: scale(4.5);
            opacity: 0;
            pointer-events: none;
        }

        /* 폰트 및 위치 수정된 상단 2줄 텍스트 (조금 더 아래로 내림) */
        .hero-title-box {
            text-align: center;
            z-index: 2;
            margin-top: 14vh; /* 이글루와 가깝게 아래로 이동 */
        }

        .hero-main-text {
            font-family: var(--font-serif);
            font-size: 34px;
            font-weight: 400;
            font-style: italic; /* 감성적인 이탤릭체 */
            letter-spacing: 1px;
            color: #f8fafc;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            margin-bottom: 6px;
        }

        .hero-sub-text {
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 300; /* 얇은 폰트 */
            letter-spacing: 5px;
            color: #fde68a;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        /* 🧊 이글루 입구에 맞게 아래로 내린 재생 버튼 */
        .ice-portal-btn {
            position: absolute;
            top: 61%; /* 입구 위치에 맞게 하단으로 더 조정 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            padding-left: 3px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            animation: floatGlow 3s infinite ease-in-out;
        }

        .ice-portal-btn:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(251, 191, 36, 0.28);
            border-color: rgba(251, 191, 36, 0.95);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.9);
            color: #fef3c7;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4); }
            50% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 12px 40px rgba(251, 191, 36, 0.45), inset 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        .hero-footer-text {
            font-size: 13px;
            font-weight: 200;
            color: #94a3b8;
            letter-spacing: 1px;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 10px;
        }

        /* === 2. 이글루 내부 (포트폴리오 메인) === */
        .main-app {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease 0.3s;
            min-height: 100vh;
            background: linear-gradient(180deg, #fefbf6 0%, #fef3c7 40%, #fefbf6 100%);
            color: #334155;
            position: relative;
            z-index: 50;
        }

        .main-app.active {
            opacity: 1;
            pointer-events: auto;
        }

        .header {
            position: sticky; top: 0; width: 100%; padding: 24px 60px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(254, 251, 246, 0.88); border-bottom: 1px solid rgba(254, 243, 199, 0.6);
        }

        .logo {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
            color: #1e293b; font-size: 20px; font-weight: 600; font-family: var(--font-serif);
        }

        .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: #d97706; display: inline-block; }

        .nav-links { display: flex; gap: 32px; list-style: none; align-items: center; font-size: 14px; }
        .nav-links a { text-decoration: none; color: #334155; }
        .nav-links a:hover { color: #d97706; }

        .btn-outside {
            background: rgba(219, 234, 254, 0.6); color: #1e3a8a; border: 1px solid #bfdbfe;
            padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        .content-section { max-width: 1100px; margin: 60px auto; padding: 0 30px; text-align: center; }
        .section-title { font-size: 32px; color: #1e293b; margin-bottom: 20px; font-family: var(--font-serif); }
        .section-desc { font-size: 16px; color: #64748b; line-height: 1.8; }

        @media (max-width: 768px) {
            .hero-main-text { font-size: 26px; }
            .hero-sub-text { font-size: 11px; letter-spacing: 3px; }
            .header { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <!-- ❄️ 눈 내리는 캔버스 -->
    <canvas id="snow-canvas"></canvas>

    <!-- 1. 랜딩 화면 -->
    <div class="hero-screen" id="heroScreen">
        <div class="hero-overlay"></div>

        <div class="hero-title-box">
            <h1 class="hero-main-text">Come in. Melt a little</h1>
            <p class="hero-sub-text">Igloo Film</p>
        </div>

        <div class="ice-portal-btn" id="enterPortalBtn" title="이글루 안으로 들어가기">
            <i class="fa-solid fa-play"></i>
        </div>

        <div class="hero-footer-text">
            아이콘을 눌러 이글루 안으로 입장하세요
        </div>
    </div>

    <!-- 2. 이글루 내부 -->
    <div class="main-app" id="mainApp">
        <header class="header">
            <a href="#" class="logo">
                <span class="logo-dot"></span>
                <span>Igloo Film</span>
            </a>
            <ul class="nav-links">
                <li><a href="#">Philosophy</a></li>
                <li><a href="#">Works</a></li>
            </ul>
            <button class="btn-outside" id="exitOutsideBtn">
                <i class="fa-solid fa-snowflake"></i> 눈밭으로 나가기
            </button>
        </header>

        <div class="content-section">
            <h2 class="section-title">Welcome to the Inner Igloo</h2>
            <p class="section-desc">
                차가운 현실 위에 피어난 따스한 상상력.<br>
                결코 녹아내리지 않을 당신만의 이야기를 만나보세요.
            </p>
        </div>
    </div>

    <script>
        // ❄️ 눈 내리기 효과 (크기를 키우고 반짝이도록 수정)
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const flakes = [];
        for (let i = 0; i < 70; i++) {
            flakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 4 + 1.5, // 눈송이 크기 키움
                d: Math.random() * 1.2 + 0.6,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            flakes.forEach(f => {
                ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
                ctx.fill();

                f.y += Math.pow(f.d, 2) * 0.3 + 0.6;
                f.x += Math.sin(f.y / 30) * 0.5;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // 🎬 페이지 전환 효과
        const enterBtn = document.getElementById('enterPortalBtn');
        const heroScreen = document.getElementById('heroScreen');
        const mainApp = document.getElementById('mainApp');
        const exitBtn = document.getElementById('exitOutsideBtn');

        enterBtn.addEventListener('click', () => {
            heroScreen.classList.add('suck-in');
            setTimeout(() => {
                mainApp.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 600);
        });

        exitBtn.addEventListener('click', () => {
            mainApp.classList.remove('active');
            heroScreen.classList.remove('suck-in');
        });
    </script>
</body>
</html>
