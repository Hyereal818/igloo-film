<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이글루 필름 | Igloo Film</title>
    <!-- 구글 영문 폰트 및 프리텐다드(고딕) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ⭐️ 로컬 꾸불림체 폰트 로드 */
        @font-face {
            font-family: 'KugleimLocal';
            src: url('kugleim.otf') format('opentype'),
                 url('kugleim.ttf') format('truetype'),
                 url('kugleim.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-kugleim: 'KugleimLocal', cursive, sans-serif;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            --font-title: 'Gowun Batang', serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0b1120;
            color: #ffffff;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* ❄️ 눈 내리는 캔버스 */
        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 150;
            opacity: 0.95;
            transition: opacity 0.4s ease;
        }

        #snow-canvas.hidden {
            opacity: 0;
        }

        /* ==============================================
           1. 이글루 내부 화면 (Inside.png)
           ============================================== */
        .main-app {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('Inside.png');
            background-size: cover;
            background-position: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transform: scale(0.95);
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1);
        }

        .main-app.active {
            transform: scale(1);
        }

        /* 투명 상단 헤더 */
        .header {
            width: 100%;
            padding: 30px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            border-bottom: none;
            z-index: 20;
        }

        .logo {
            text-decoration: none;
            color: #ffffff;
            font-size: 24px;
            font-family: var(--font-kugleim);
            letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 255, 255, 0.4);
            transition: opacity 0.3s ease;
        }

        .logo:hover {
            opacity: 0.9;
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
            align-items: center;
        }

        .nav-link-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            letter-spacing: 2px;
            cursor: pointer;
            padding: 6px 4px;
            position: relative;
            transition: all 0.3s ease;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        .nav-link-btn:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .nav-link-btn.active {
            color: #ffffff;
            font-weight: 600;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.9),
                0 0 20px rgba(255, 255, 255, 0.7),
                0 0 35px rgba(255, 255, 255, 0.5),
                0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .nav-link-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: #ffffff;
            border-radius: 2px;
            box-shadow: 0 0 10px #ffffff, 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .btn-outside {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s ease;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .btn-outside:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
        }

        /* 🌐 홀로그램 및 좌우 네비게이션 스테이지 */
        .hologram-stage-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 0 40px;
            perspective: 1200px;
        }

        .hologram-nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            z-index: 30;
        }

        .hologram-nav-btn:hover {
            transform: scale(1.15);
            background: rgba(255, 255, 255, 0.25);
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
        }

        /* 자동 크기 반응형 홀로그램 패널 */
        .hologram-panel {
            position: relative;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(251, 191, 36, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.25);
            animation: hologramFloat 4.5s ease-in-out infinite;
            transform: rotateX(6deg);
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        height 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        aspect-ratio 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hologram-panel.mode-philosophy {
            width: 660px;
            max-width: 72vw;
            aspect-ratio: 16/9;
            height: auto;
        }

        .hologram-panel.mode-works {
            width: 320px;
            max-width: 80vw;
            height: 568px;
            max-height: 68vh;
            aspect-ratio: 9/16;
        }

        .hologram-panel::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 5;
            pointer-events: none;
            opacity: 0.45;
        }

        @keyframes hologramFloat {
            0%, 100% { transform: translateY(0) rotateX(6deg); box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 50px rgba(251, 191, 36, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.25); }
            50% { transform: translateY(-10px) rotateX(4deg); box-shadow: 0 35px 70px rgba(0, 0, 0, 0.8), 0 0 70px rgba(251, 191, 36, 0.45), inset 0 0 30px rgba(255, 255, 255, 0.4); }
        }

        .hologram-content {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: scale(0.96);
            z-index: 3;
        }

        .hologram-content.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* ⭐️ 1. Philosophy 뷰 */
        .philosophy-view {
            text-align: center;
            padding: 30px 40px;
            color: #ffffff;
        }

        .philosophy-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: #fde68a;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .philosophy-title {
            font-family: var(--font-title);
            font-size: 26px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            margin-bottom: 22px;
            word-break: keep-all;
        }

        /* ⭐️ 아주 연하고 선명한 아이스 블루 (배경 대비 극대화) */
        .highlight-cold {
            color: #bae6fd;
            text-shadow: 0 0 16px rgba(186, 230, 253, 0.8), 0 0 30px rgba(56, 189, 248, 0.5);
            font-weight: 700;
        }

        .philosophy-desc {
            font-family: var(--font-sans);
            font-size: 15px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.9;
            max-width: 480px;
            word-break: keep-all;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        .philosophy-desc p {
            margin-bottom: 8px;
        }

        .philosophy-desc .last-line {
            margin-top: 14px;
            color: #fef3c7;
            font-weight: 400;
        }

        /* ⭐️ 2. Works 뷰 (영상 + 캡션 오버레이 + 컨트롤러) */
        .works-view {
            padding: 0;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .works-view video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 영상 하단 감성 소개 캡션 오버레이 */
        .video-caption-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 40px 18px 56px 18px;
            background: linear-gradient(to top, rgba(11, 17, 32, 0.9) 0%, rgba(11, 17, 32, 0.4) 60%, transparent 100%);
            z-index: 6;
            text-align: left;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .video-caption-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            color: #93c5fd;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .video-caption-title {
            font-family: var(--font-kugleim);
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 4px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        .video-caption-desc {
            font-family: var(--font-sans);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.4;
            word-break: keep-all;
        }

        /* ⭐️ 미니멀 플로팅 영상 컨트롤러 */
        .video-controls-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            z-index: 10;
            opacity: 0.85;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .works-view:hover .video-controls-bar {
            opacity: 1;
        }

        .video-ctrl-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .video-ctrl-btn:hover {
            color: #bae6fd;
            transform: scale(1.15);
        }

        .footer-spacer {
            height: 30px;
        }

        /* ==============================================
           2. 랜딩 화면 (바깥 세상)
           ============================================== */
        .hero-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('igloo_3.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 100;
            transform-origin: 50% 61%;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.9s cubic-bezier(0.7, 0, 0.2, 1);
            opacity: 1;
            pointer-events: auto;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 17, 32, 0.1) 0%, rgba(11, 17, 32, 0.55) 100%);
            z-index: -1;
        }

        .hero-screen.suck-in {
            transform: scale(7.5);
            opacity: 0;
            pointer-events: none;
        }

        .hero-title-box {
            text-align: center;
            z-index: 2;
            margin-top: 12vh;
            padding: 0 20px;
            transition: opacity 0.3s ease;
        }

        .hero-screen.suck-in .hero-title-box,
        .hero-screen.suck-in .portal-btn-wrapper,
        .hero-screen.suck-in .hero-footer-text {
            opacity: 0;
        }

        .hero-main-text {
            font-family: var(--font-kugleim) !important;
            font-size: 52px;
            font-weight: normal;
            font-style: normal !important;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 25px rgba(251, 191, 36, 0.3);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .hero-sub-text {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #fde68a;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        .portal-btn-wrapper {
            position: absolute;
            top: 61%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: opacity 0.3s ease;
        }

        .custom-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(251, 191, 36, 0.6);
            color: #fef3c7;
            padding: 6px 14px;
            border-radius: 12px;
            font-family: var(--font-kugleim);
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(251, 191, 36, 0.3);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .custom-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(251, 191, 36, 0.6) transparent transparent transparent;
        }

        .portal-btn-wrapper:hover .custom-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .ice-portal-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            padding-left: 4px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            animation: floatGlow 3s infinite ease-in-out;
        }

        .portal-btn-wrapper:hover .ice-portal-btn {
            transform: scale(1.15);
            background: rgba(251, 191, 36, 0.3);
            border-color: rgba(251, 191, 36, 0.95);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.9);
            color: #fef3c7;
        }

        @keyframes floatGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(251, 191, 36, 0.45), inset 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        .hero-footer-text {
            font-size: 13px;
            font-weight: 300;
            color: #94a3b8;
            letter-spacing: 1px;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .hero-main-text { font-size: 34px; }
            .hero-sub-text { font-size: 12px; letter-spacing: 2px; }
            .header { padding: 20px; }
            .hologram-stage-wrapper { padding: 0 10px; gap: 10px; }
            .hologram-panel.mode-philosophy { width: 85vw; }
            .hologram-panel.mode-works { width: 280px; height: 497px; }
            .hologram-nav-btn { width: 38px; height: 38px; font-size: 14px; }
            .philosophy-title { font-size: 19px; }
            .philosophy-desc { font-size: 13px; }
        }
    </style>
</head>
<body>

    <!-- ❄️ 눈 내리는 캔버스 -->
    <canvas id="snow-canvas"></canvas>

    <!-- 1. 이글루 내부 화면 (Inside.png) -->
    <div class="main-app" id="mainApp">
        <header class="header">
            <a href="#" class="logo">IGLOO FILM</a>

            <ul class="nav-links">
                <li><button class="nav-link-btn active" id="navPhilosophy">Philosophy</button></li>
                <li><button class="nav-link-btn" id="navWorks">Works</button></li>
            </ul>

            <button class="btn-outside" id="exitOutsideBtn">
                <i class="fa-solid fa-snowflake"></i> Outside
            </button>
        </header>

        <!-- 홀로그램 + 좌우 네비게이션 -->
        <div class="hologram-stage-wrapper">
            <button class="hologram-nav-btn" id="prevSlideBtn" title="이전">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="hologram-panel mode-philosophy" id="hologramPanel">
                <!-- 1. Philosophy 뷰 (이모지 제거 및 밝은 하늘색 강조) -->
                <div class="hologram-content philosophy-view active" id="viewPhilosophy">
                    <p class="philosophy-tag">Brand Philosophy</p>
                    <h2 class="philosophy-title">
                        <span class="highlight-cold">차가운 현실</span>에 따뜻함 한 스푼
                    </h2>
                    <div class="philosophy-desc">
                        <p>냉정한 일상에서 지나쳤던 따스함을</p>
                        <p>글과 영상으로 담아냅니다.</p>
                        <p>조금은 엉뚱하고, 때로는 아련하게.</p>
                        <p class="last-line">잠시 들어와, 마음을 녹이고 가세요.</p>
                    </div>
                </div>

                <!-- 2. Works 뷰 (영상 + 소개 캡션 + 미니 컨트롤 바) -->
                <div class="hologram-content works-view" id="viewWorks">
                    <video id="hologramVideo" autoplay muted loop playsinline>
                        <source src="showreel.mp4" type="video/mp4">
                    </video>

                    <!-- 감성 영상 소개 캡션 오버레이 (문구는 원하는 대로 수정 가능) -->
                    <div class="video-caption-overlay">
                        <div class="video-caption-tag">Featured Story</div>
                        <div class="video-caption-title">101호의 기억</div>
                        <div class="video-caption-desc">차가운 밤, 작은 불빛 아래 피어난 따스한 이야기.</div>
                    </div>

                    <!-- 일시정지 & 볼륨 토글 컨트롤러 -->
                    <div class="video-controls-bar">
                        <button class="video-ctrl-btn" id="videoPlayPauseBtn" title="재생/일시정지">
                            <i class="fa-solid fa-pause"></i>
                        </button>
                        <button class="video-ctrl-btn" id="videoMuteBtn" title="소리 켜기/끄기">
                            <i class="fa-solid fa-volume-xmark"></i>
                        </button>
                    </div>
                </div>
            </div>

            <button class="hologram-nav-btn" id="nextSlideBtn" title="다음">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <div class="footer-spacer"></div>
    </div>

    <!-- 2. 랜딩 화면 (바깥 세상) -->
    <div class="hero-screen" id="heroScreen">
        <div class="hero-overlay"></div>

        <div class="hero-title-box">
            <h1 class="hero-main-text">Come in, Melt a little.</h1>
            <p class="hero-sub-text">Igloo Film</p>
        </div>

        <div class="portal-btn-wrapper">
            <div class="custom-tooltip">Welcome!</div>
            <div class="ice-portal-btn" id="enterPortalBtn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>

        <div class="hero-footer-text">
            아이콘을 눌러 이글루 안으로 입장하세요
        </div>
    </div>

    <script>
        // ❄️ 1. 눈 내리기 효과
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const flakes = [];
        for (let i = 0; i < 70; i++) {
            flakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 4 + 1.5,
                d: Math.random() * 1.2 + 0.6,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            flakes.forEach(f => {
                ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
                ctx.fill();

                f.y += Math.pow(f.d, 2) * 0.3 + 0.6;
                f.x += Math.sin(f.y / 30) * 0.5;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // 🎬 2. 화면 전환 로직
        const enterBtn = document.getElementById('enterPortalBtn');
        const heroScreen = document.getElementById('heroScreen');
        const mainApp = document.getElementById('mainApp');
        const exitBtn = document.getElementById('exitOutsideBtn');
        const video = document.getElementById('hologramVideo');

        enterBtn.addEventListener('click', () => {
            canvas.classList.add('hidden');
            heroScreen.classList.add('suck-in');
            mainApp.classList.add('active');
            if(video && currentTab === 'works') video.play();
        });

        exitBtn.addEventListener('click', () => {
            mainApp.classList.remove('active');
            heroScreen.classList.remove('suck-in');
            canvas.classList.remove('hidden');
            if(video) video.pause();
        });

        // 🔀 3. Philosophy (가로) ⇄ Works (세로 9:16) 탭 전환
        const navPhilosophy = document.getElementById('navPhilosophy');
        const navWorks = document.getElementById('navWorks');
        const viewPhilosophy = document.getElementById('viewPhilosophy');
        const viewWorks = document.getElementById('viewWorks');
        const hologramPanel = document.getElementById('hologramPanel');
        const prevBtn = document.getElementById('prevSlideBtn');
        const nextBtn = document.getElementById('nextSlideBtn');

        let currentTab = 'philosophy';

        function switchTab(tab) {
            currentTab = tab;
            if (tab === 'philosophy') {
                navPhilosophy.classList.add('active');
                navWorks.classList.remove('active');
                
                hologramPanel.classList.remove('mode-works');
                hologramPanel.classList.add('mode-philosophy');

                viewPhilosophy.classList.add('active');
                viewWorks.classList.remove('active');
                if(video) video.pause();
            } else {
                navPhilosophy.classList.remove('active');
                navWorks.classList.add('active');

                hologramPanel.classList.remove('mode-philosophy');
                hologramPanel.classList.add('mode-works');

                viewPhilosophy.classList.remove('active');
                viewWorks.classList.add('active');
                if(video) {
                    video.play();
                    updatePlayPauseIcon();
                }
            }
        }

        function toggleTab() {
            if (currentTab === 'philosophy') {
                switchTab('works');
            } else {
                switchTab('philosophy');
            }
        }

        navPhilosophy.addEventListener('click', () => switchTab('philosophy'));
        navWorks.addEventListener('click', () => switchTab('works'));
        prevBtn.addEventListener('click', toggleTab);
        nextBtn.addEventListener('click', toggleTab);

        // 🎛️ 4. 영상 커스텀 컨트롤러 로직 (재생/일시정지, 음소거 토글)
        const playPauseBtn = document.getElementById('videoPlayPauseBtn');
        const muteBtn = document.getElementById('videoMuteBtn');

        function updatePlayPauseIcon() {
            if(video.paused) {
                playPauseBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
            } else {
                playPauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
            }
        }

        playPauseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if(video.paused) {
                video.play();
            } else {
                video.pause();
            }
            updatePlayPauseIcon();
        });

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            video.muted = !video.muted;
            if(video.muted) {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
            } else {
                muteBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
            }
        });
    </script>
</body>
</html>
