<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이글루 필름 | Igloo Film</title>
    <!-- Igloo Film용 구글 영문 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        /* ⭐️ 내 깃허브에 올린 꾸불림체 파일 직접 로드 */
        @font-face {
            font-family: 'KugleimLocal';
            src: url('kugleim.otf') format('opentype'),
                 url('kugleim.ttf') format('truetype'),
                 url('kugleim.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --font-kugleim: 'KugleimLocal', cursive, sans-serif;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Montserrat', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0b1120;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ❄️ 눈 내리는 캔버스 */
        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10; opacity: 0.95;
        }

        /* ==============================================
           1. 랜딩 화면 (바깥 세상)
           ============================================== */
        .hero-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('igloo_3.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            z-index: 100;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 17, 32, 0.1) 0%, rgba(11, 17, 32, 0.55) 100%);
            z-index: -1;
        }

        .hero-screen.suck-in {
            transform: scale(4.5);
            opacity: 0;
            pointer-events: none;
        }

        /* 상단 타이틀 영역 */
        .hero-title-box {
            text-align: center;
            z-index: 2;
            margin-top: 12vh;
            padding: 0 20px;
        }

        /* 윗줄: 직접 올린 꾸불림체 적용 */
        .hero-main-text {
            font-family: var(--font-kugleim) !important;
            font-size: 52px;
            font-weight: normal;
            font-style: normal !important;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), 0 0 25px rgba(251, 191, 36, 0.3);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        /* 아랫줄: Cinzel 폰트 유지 */
        .hero-sub-text {
            font-family: var(--font-serif);
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #fde68a;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }

        /* 🧊 이글루 입구 원형 얼음 버튼 래퍼 */
        .portal-btn-wrapper {
            position: absolute;
            top: 61%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 마우스 올렸을 때 즉시 뜨는 Welcome! 툴팁 */
        .custom-tooltip {
            position: absolute;
            bottom: calc(100% + 14px);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(251, 191, 36, 0.6);
            color: #fef3c7;
            padding: 6px 14px;
            border-radius: 12px;
            font-family: var(--font-kugleim);
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 15px rgba(251, 191, 36, 0.3);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            pointer-events: none;
            white-space: nowrap;
        }

        .custom-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px;
            border-style: solid;
            border-color: rgba(251, 191, 36, 0.6) transparent transparent transparent;
        }

        .portal-btn-wrapper:hover .custom-tooltip {
            opacity: 1;
            transform: translateY(0);
        }

        .ice-portal-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            padding-left: 4px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            animation: floatGlow 3s infinite ease-in-out;
        }

        .portal-btn-wrapper:hover .ice-portal-btn {
            transform: scale(1.15);
            background: rgba(251, 191, 36, 0.3);
            border-color: rgba(251, 191, 36, 0.95);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.85), inset 0 0 20px rgba(255, 255, 255, 0.9);
            color: #fef3c7;
        }

        @keyframes floatGlow {
            0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 15px rgba(255, 255, 255, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 12px 40px rgba(251, 191, 36, 0.45), inset 0 0 20px rgba(255, 255, 255, 0.6); }
        }

        .hero-footer-text {
            font-size: 13px;
            font-weight: 300;
            color: #94a3b8;
            letter-spacing: 1px;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            margin-bottom: 10px;
        }

        /* ==============================================
           2. 이글루 내부 화면 (Inside.png + 홀로그램 영상)
           ============================================== */
        .main-app {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('Inside.png');
            background-size: cover;
            background-position: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease 0.3s;
            z-index: 50;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .main-app.active {
            opacity: 1;
            pointer-events: auto;
        }

        .header {
            width: 100%; padding: 24px 60px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
            background: rgba(15, 23, 42, 0.4); border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
            color: #ffffff; font-size: 20px; font-family: var(--font-serif);
        }

        .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: #fbbf24; display: inline-block; }

        .nav-links { display: flex; gap: 32px; list-style: none; align-items: center; font-size: 14px; }
        .nav-links a { text-decoration: none; color: #cbd5e1; }
        .nav-links a:hover { color: #fbbf24; }

        .btn-outside {
            background: rgba(255, 255, 255, 0.12); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 8px; backdrop-filter: blur(4px);
            transition: all 0.3s ease;
        }
        .btn-outside:hover {
            background: rgba(251, 191, 36, 0.25);
            border-color: rgba(251, 191, 36, 0.8);
        }

        .hologram-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
            padding: 20px;
        }

        .hologram-panel {
            position: relative;
            width: 600px;
            max-width: 80vw;
            aspect-ratio: 16/9;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            overflow: hidden;
            backdrop-filter: blur(4px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(251, 191, 36, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.3);
            animation: hologramFloat 4s ease-in-out infinite;
            transform: rotateX(8deg);
        }

        .hologram-panel::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        @keyframes hologramFloat {
            0%, 100% { transform: translateY(0) rotateX(8deg); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(251, 191, 36, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.3); }
            50% { transform: translateY(-12px) rotateX(6deg); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 60px rgba(251, 191, 36, 0.5), inset 0 0 30px rgba(255, 255, 255, 0.5); }
        }

        .hologram-panel video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }

        .footer-spacer {
            height: 40px;
        }

        @media (max-width: 768px) {
            .hero-main-text { font-size: 34px; }
            .hero-sub-text { font-size: 12px; letter-spacing: 2px; }
            .header { padding: 16px 20px; }
            .hologram-panel { width: 90vw; }
        }
    </style>
</head>
<body>

    <!-- ❄️ 눈 내리는 캔버스 -->
    <canvas id="snow-canvas"></canvas>

    <!-- 1. 랜딩 화면 -->
    <div class="hero-screen" id="heroScreen">
        <div class="hero-overlay"></div>

        <div class="hero-title-box">
            <h1 class="hero-main-text">Come in. Melt a little</h1>
            <p class="hero-sub-text">Igloo Film</p>
        </div>

        <!-- 커스텀 Welcome! 말풍선이 달린 얼음 버튼 -->
        <div class="portal-btn-wrapper">
            <div class="custom-tooltip">Welcome!</div>
            <div class="ice-portal-btn" id="enterPortalBtn">
                <i class="fa-solid fa-play"></i>
            </div>
        </div>

        <div class="hero-footer-text">
            아이콘을 눌러 이글루 안으로 입장하세요
        </div>
    </div>

    <!-- 2. 이글루 내부 화면 -->
    <div class="main-app" id="mainApp">
        <header class="header">
            <a href="#" class="logo">
                <span class="logo-dot"></span>
                <span>Igloo Film</span>
            </a>
            <ul class="nav-links">
                <li><a href="#">Philosophy</a></li>
                <li><a href="#">Works</a></li>
            </ul>
            <button class="btn-outside" id="exitOutsideBtn">
                <i class="fa-solid fa-snowflake"></i> Outside
            </button>
        </header>

        <div class="hologram-stage">
            <div class="hologram-panel">
                <video autoplay muted loop playsinline>
                    <source src="" type="video/mp4">
                </video>
            </div>
        </div>

        <div class="footer-spacer"></div>
    </div>

    <script>
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const flakes = [];
        for (let i = 0; i < 70; i++) {
            flakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 4 + 1.5,
                d: Math.random() * 1.2 + 0.6,
                alpha: Math.random() * 0.5 + 0.5
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            flakes.forEach(f => {
                ctx.fillStyle = `rgba(255, 255, 255, ${f.alpha})`;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
                ctx.fill();

                f.y += Math.pow(f.d, 2) * 0.3 + 0.6;
                f.x += Math.sin(f.y / 30) * 0.5;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        const enterBtn = document.getElementById('enterPortalBtn');
        const heroScreen = document.getElementById('heroScreen');
        const mainApp = document.getElementById('mainApp');
        const exitBtn = document.getElementById('exitOutsideBtn');

        enterBtn.addEventListener('click', () => {
            heroScreen.classList.add('suck-in');
            setTimeout(() => {
                mainApp.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 600);
        });

        exitBtn.addEventListener('click', () => {
            mainApp.classList.remove('active');
            heroScreen.classList.remove('suck-in');
        });
    </script>
</body>
</html>
