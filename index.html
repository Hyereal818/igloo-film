<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이글루 필름 | Igloo Film</title>
    <!-- Google Fonts: 감성적인 영문 세리프와 산세리프 조합 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-warm: #fcf9f2;
            --color-deep-night: #1e293b;
            --color-warm-amber: #fef3c7;
            --color-warm-gold: #d97706;
            --font-serif: 'Cinzel', 'Gowun Batang', serif;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: #0b1120;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ❄️ 눈 내리는 효과를 위한 캔버스 */
        #snow-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 10; opacity: 0.8;
        }

        /* === 1. 랜딩 화면 (고정 배경 이미지 + 타이틀 + 얼음 재생 버튼) === */
        .hero-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('igloo_3.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 50px 20px;
            z-index: 100;
            transition: transform 1.2s cubic-bezier(0.7, 0, 0.2, 1), opacity 0.8s ease;
        }

        /* 은은한 어두운 비네팅 오버레이 (텍스트 가독성 향상) */
        .hero-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(11, 17, 32, 0.15) 0%, rgba(11, 17, 32, 0.5) 100%);
            z-index: -1;
        }

        /* 화면 전환(안으로 빨려 들어감) 효과 클래스 */
        .hero-screen.suck-in {
            transform: scale(4.5);
            opacity: 0;
            pointer-events: none;
        }

        /* 상단 2줄 텍스트 영역 */
        .hero-title-box {
            text-align: center;
            z-index: 2;
            margin-top: 20px;
            animation: fadeInDown 1.2s ease;
        }

        .hero-main-text {
            font-family: var(--font-serif);
            font-size: 38px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 30px rgba(251, 191, 36, 0.2);
            margin-bottom: 8px;
        }

        .hero-sub-text {
            font-family: var(--font-serif);
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 4px;
            color: #fde68a;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* 중앙 이글루 입구에 배치될 투명 얼음 재생 버튼 */
        .ice-portal-btn {
            position: absolute;
            top: 57%; /* 이글루 입구 위치에 맞게 미세조정 가능 */
            left: 50%;
            transform: translate(-50%, -50%);
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1.5px solid rgba(255, 255, 255, 0.5);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            padding-left: 4px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            animation: floatGlow 3s infinite ease-in-out;
        }

        /* 마우스를 올렸을 때 (불빛이 뿜어져 나오는 호버 효과) */
        .ice-portal-btn:hover {
            transform: translate(-50%, -50%) scale(1.15);
            background: rgba(251, 191, 36, 0.25);
            border-color: rgba(251, 191, 36, 0.9);
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.8), inset 0 0 20px rgba(255, 255, 255, 0.8);
            color: #fef3c7;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.3); }
            50% { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 12px 40px rgba(251, 191, 36, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.5); }
        }

        /* 하단 캡션 */
        .hero-footer-text {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 1px;
            z-index: 2;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* === 2. 이글루 내부 (포트폴리오 메인 화면) === */
        .main-app {
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease 0.3s;
            min-height: 100vh;
            background: linear-gradient(180deg, #fefbf6 0%, #fef3c7 40%, #fefbf6 100%);
            color: #334155;
            position: relative;
            z-index: 50;
        }

        .main-app.active {
            opacity: 1;
            pointer-events: auto;
        }

        .header {
            position: sticky; top: 0; width: 100%; padding: 24px 60px;
            display: flex; justify-content: space-between; align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(254, 251, 246, 0.88); border-bottom: 1px solid rgba(254, 243, 199, 0.6);
        }

        .logo {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
            color: #1e293b; font-size: 22px; font-weight: 700; font-family: var(--font-serif);
        }

        .logo-dot { width: 10px; height: 10px; border-radius: 50%; background: #d97706; display: inline-block; }

        .nav-links { display: flex; gap: 32px; list-style: none; align-items: center; }
        .nav-links a { text-decoration: none; color: #334155; font-size: 15px; }
        .nav-links a:hover { color: #d97706; }

        .btn-outside {
            background: rgba(219, 234, 254, 0.6); color: #1e3a8a; border: 1px solid #bfdbfe;
            padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
        }

        .content-section { max-width: 1100px; margin: 60px auto; padding: 0 30px; text-align: center; }
        .section-title { font-size: 32px; color: #1e293b; margin-bottom: 20px; font-family: var(--font-serif); }
        .section-desc { font-size: 16px; color: #64748b; line-height: 1.8; }

        @media (max-width: 768px) {
            .hero-main-text { font-size: 28px; }
            .hero-sub-text { font-size: 13px; letter-spacing: 2px; }
            .header { padding: 16px 20px; }
        }
    </style>
</head>
<body>

    <!-- ❄️ 눈 내리는 캔버스 -->
    <canvas id="snow-canvas"></canvas>

    <!-- ==============================================
         1. 랜딩 화면 (고정 배경 + 2줄 타이틀 + 얼음 재생 버튼)
         ============================================== -->
    <div class="hero-screen" id="heroScreen">
        <div class="hero-overlay"></div>

        <!-- 상단 2줄 텍스트 (윗줄 크게) -->
        <div class="hero-title-box">
            <h1 class="hero-main-text">Come in. Melt a little</h1>
            <p class="hero-sub-text">Igloo Film</p>
        </div>

        <!-- 이글루 입구 위치의 투명 얼음 재생 버튼 -->
        <div class="ice-portal-btn" id="enterPortalBtn" title="이글루 안으로 들어가기">
            <i class="fa-solid fa-play"></i>
        </div>

        <!-- 하단 작은 안내 문구 -->
        <div class="hero-footer-text">
            아이콘을 눌러 이글루 안으로 입장하세요
        </div>
    </div>


    <!-- ==============================================
         2. 이글루 내부 (포트폴리오 메인 화면)
         ============================================== -->
    <div class="main-app" id="mainApp">
        <header class="header">
            <a href="#" class="logo">
                <span class="logo-dot"></span>
                <span>Igloo Film</span>
            </a>
            <ul class="nav-links">
                <li><a href="#">Philosophy</a></li>
                <li><a href="#">Works</a></li>
            </ul>
            <button class="btn-outside" id="exitOutsideBtn">
                <i class="fa-solid fa-snowflake"></i> 눈밭으로 나가기
            </button>
        </header>

        <div class="content-section">
            <h2 class="section-title">Welcome to the Inner Igloo</h2>
            <p class="section-desc">
                차가운 현실 위에 피어난 따스한 상상력.<br>
                결코 녹아내리지 않을 당신만의 이야기를 만나보세요.
            </p>
        </div>
    </div>

    <script>
        // ❄️ 1. 부드러운 함박눈 내리는 자바스크립트 효과
        const canvas = document.getElementById('snow-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const flakes = [];
        for (let i = 0; i < 50; i++) {
            flakes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 3.5 + 1, // 함박눈 크기
                d: Math.random() * 1 + 0.5   // 떨어지는 속도
            });
        }

        function drawSnow() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
            ctx.beginPath();
            flakes.forEach(f => {
                ctx.moveTo(f.x, f.y);
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2, true);
            });
            ctx.fill();

            flakes.forEach(f => {
                f.y += Math.pow(f.d, 2) * 0.4 + 0.5;
                f.x += Math.sin(f.y / 40) * 0.4;
                if (f.y > canvas.height) {
                    f.y = -10;
                    f.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(drawSnow);
        }
        drawSnow();

        // 🎬 2. 얼음 버튼 클릭 시 안으로 빨려 들어가는 인터랙션
        const enterBtn = document.getElementById('enterPortalBtn');
        const heroScreen = document.getElementById('heroScreen');
        const mainApp = document.getElementById('mainApp');
        const exitBtn = document.getElementById('exitOutsideBtn');

        enterBtn.addEventListener('click', () => {
            heroScreen.classList.add('suck-in');
            setTimeout(() => {
                mainApp.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 600);
        });

        exitBtn.addEventListener('click', () => {
            mainApp.classList.remove('active');
            heroScreen.classList.remove('suck-in');
        });
    </script>
</body>
</html>
